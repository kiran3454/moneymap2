<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .title {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 900px;
        }
        .animation {
            width: 300px;
            height: 300px;
            margin-right: -20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            background: #ffffff;
            text-align: center;
        }
        .login-btn {
            width: 100%;
            background: #6a11cb;
            transition: 0.3s;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            color: white;
        }
        .login-btn:hover {
            background: #2575fc;
        }
        .form-control {
            border-radius: 5px;
        }
        .form-label {
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                text-align: center;
            }
            .animation {
                width: 250px;
                height: 250px;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="title">Mon₹yMap</div>
    <div class="container">
        <div class="login-card">
            <h2 class="mb-4">Welcome Back</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <form action="{{ url_for('login') }}" method="post">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
        </div>
        <dotlottie-player class="animation" src="https://lottie.host/b2e06753-e2fa-4bc2-9ef3-eb31651dcf73/YRqQKznRiq.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
    </div>
</body>
</html>
